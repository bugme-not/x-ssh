worker_processes auto;
events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    tcp_nodelay on;
    tcp_nopush off;
    sendfile off;
    keepalive_timeout 3600;

    # Dynamic HTTP/2 vs HTTP/1.1 connection handling
    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "S2w0eVY4bTBRN3pQNjFqWA==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Enable HTTP/2 on port 8080 (Required for gRPC and XHTTP)
        listen 8080 http2;
        server_name _;

        # -----------------------------------------------------------------
        # 1. SUBSCRIPTION ENDPOINT
        # -----------------------------------------------------------------
        location /sub {
            proxy_pass http://127.0.0.1:8000/sub;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------------------------------------------
        # 2. SSH WEBSOCKET
        # -----------------------------------------------------------------
        location /cxlvin {
            proxy_pass http://127.0.0.1:2222;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # -----------------------------------------------------------------
        # 3. WEBSOCKET ENDPOINTS
        # -----------------------------------------------------------------
        # VLESS WebSocket
        location /CxlvinVlWS {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Trojan WebSocket
        location /CxlvinTRWS {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10086;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -----------------------------------------------------------------
        # 4. XHTTP ENDPOINTS (Supports stream-one, stream-up, packet-up, auto)
        # -----------------------------------------------------------------
        # Trojan XHTTP (Port 10087)
        location /CxlvinTRXH {
            proxy_pass http://127.0.0.1:10087;
            proxy_http_version 1.1;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Critical for XHTTP streaming & packet modes
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # VLESS XHTTP (Port 10088)
        location /CxlvinVlXH {
            proxy_pass http://127.0.0.1:10088;
            proxy_http_version 1.1;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Critical for XHTTP streaming & packet modes
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -----------------------------------------------------------------
        # 5. gRPC ENDPOINTS
        # -----------------------------------------------------------------
        # Trojan gRPC (Port 10089)
        location /cxlvintr-grpc {
            grpc_pass grpc://127.0.0.1:10089;
            grpc_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_socket_keepalive on;
            client_body_buffer_size 10m;
        }

        # VLESS gRPC (Port 10090)
        location /cxlvinvl-grpc {
            grpc_pass grpc://127.0.0.1:10090;
            grpc_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_socket_keepalive on;
            client_body_buffer_size 10m;
        }

        # -----------------------------------------------------------------
        # FALLBACK / REDIRECT
        # -----------------------------------------------------------------
        location / {
            return 302 https://youtu.be/z-3Cnrqe_uA?si=fKWe2-MvCv37dwYV;
        }
    }
}
